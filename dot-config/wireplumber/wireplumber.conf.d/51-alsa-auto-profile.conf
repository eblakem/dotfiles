# Arch's shipped monitors/alsa.lua hardcodes api.acp.auto-profile/auto-port
# to false, which leaves ALSA cards stuck on the "off" profile with no
# real sink/source until manually selected. Restore normal auto-selection.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port    = true
      }
    }
  }
]
